name: Orchestra CI

on:
  push:
    branches:
      - develop
      - main
      - Main
  pull_request:
    branches:
      - develop
      - main
      - Main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-test:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: test
      LLM_PROVIDER: test
      EMBEDDING_PROVIDER: test
      DATABASE_URL: "sqlite:///:memory:"
      JWT_SECRET: test-jwt-secret-key-for-testing-only-12345
      RATE_LIMIT_BACKEND: memory
      RATE_LIMIT_ENABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Verify application import safety
        run: |
          python -c "import app.main; print('Import safety verification passed')"

      - name: Run backend test suites
        run: |
          cd backend
          pytest tests/ -v -m "not load and not integration"

  frontend-lint-test:
    name: Frontend Quality Gates & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint check
        working-directory: frontend
        run: npm run lint

      - name: TypeScript type checking
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run unit & component tests (Vitest)
        working-directory: frontend
        run: npm run test

      - name: Build Next.js production bundle
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://127.0.0.1:8080"

  playwright-e2e:
    name: End-to-End Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: "true"
          PYTHON_EXEC: python3
          ENVIRONMENT: test
          LLM_PROVIDER: test
          EMBEDDING_PROVIDER: test
          JWT_SECRET: test-jwt-secret-key-for-testing-only-12345
          COOKIE_SECURE: "false"

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            frontend/playwright-report/
          retention-days: 7

  container-build-verify:
    name: Multi-Stage Container Image Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: orchestra-backend:${{ github.sha }}

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: orchestra-frontend:${{ github.sha }}

      - name: Build Reverse Proxy Image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: false
          tags: orchestra-reverse-proxy:${{ github.sha }}

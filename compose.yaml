services:
  postgres:
    image: postgres:16
    container_name: orchestra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orchestra}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - orchestra_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - orchestra_data

  redis:
    image: redis:7-alpine
    container_name: orchestra-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - orchestra_data

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: orchestra-qdrant
    restart: unless-stopped
    volumes:
      - orchestra_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - orchestra_data

  migration:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: orchestra-migration
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orchestra}"
      ENVIRONMENT: "production"
      JWT_SECRET: ${JWT_SECRET:-temporary-bootstrap-jwt-secret-min-32-chars!}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orchestra_data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: orchestra-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orchestra}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      QDRANT_URL: "http://qdrant:6333"
      ENVIRONMENT: "production"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_API_KEY: ${LLM_API_KEY:-bootstrap-production-llm-key}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai_compatible}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-bootstrap-production-embedding-key}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      CORS_ORIGINS: '["http://localhost:${ORCHESTRA_PORT:-8080}","http://127.0.0.1:${ORCHESTRA_PORT:-8080}"]'
      STORAGE_LOCAL_ROOT: "/app/data/storage"
      WORKSPACE_BASE_DIR: "/app/workspaces"
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - orchestra_storage_data:/app/data/storage
      - orchestra_workspace_data:/app/workspaces
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - orchestra_data
      - orchestra_edge
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health/ready\")' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: orchestra-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      NEXT_PUBLIC_API_URL: "http://localhost:${ORCHESTRA_PORT:-8080}"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - orchestra_edge
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://127.0.0.1:3000/\", (r) => { process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1); }).on(\"error\", () => process.exit(1));'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  reverse-proxy:
    build:
      context: nginx
      dockerfile: Dockerfile
    container_name: orchestra-reverse-proxy
    restart: unless-stopped
    ports:
      - "${ORCHESTRA_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - orchestra_edge

networks:
  orchestra_data:
    internal: true
  orchestra_edge:

volumes:
  orchestra_pg_data:
  orchestra_qdrant_data:
  orchestra_storage_data:
  orchestra_workspace_data:

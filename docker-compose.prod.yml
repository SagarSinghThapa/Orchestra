services:
  postgres:
    image: postgres:16
    container_name: orchestra-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orchestra}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production .env}
    volumes:
      - orchestra_prod_pg_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - orchestra_data

  redis:
    image: redis:7-alpine
    container_name: orchestra-redis-prod
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - orchestra_data

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: orchestra-qdrant-prod
    restart: always
    volumes:
      - orchestra_prod_qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - orchestra_data

  migration:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: orchestra-migration-prod
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orchestra}"
      ENVIRONMENT: "production"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in production .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orchestra_data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: orchestra-backend-prod
    restart: always
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orchestra}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      QDRANT_URL: "http://qdrant:6333"
      ENVIRONMENT: "production"
      COOKIE_SECURE: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in production .env}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY must be set in production .env}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai_compatible}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${LLM_API_KEY}}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_BACKEND: "redis"
      RATE_LIMIT_REDIS_FAIL_CLOSED: "true"
      CORS_ORIGINS: '["https://${ORCHESTRA_DOMAIN:-localhost}"]'
      STORAGE_LOCAL_ROOT: "/app/data/storage"
      WORKSPACE_BASE_DIR: "/app/workspaces"
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - orchestra_prod_storage_data:/app/data/storage
      - orchestra_prod_workspace_data:/app/workspaces
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - orchestra_data
      - orchestra_edge
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health/ready\")' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: orchestra-frontend-prod
    restart: always
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      NEXT_PUBLIC_API_URL: ""
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - orchestra_edge
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://127.0.0.1:3000/\", (r) => { process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1); }).on(\"error\", () => process.exit(1));'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  reverse-proxy:
    build:
      context: nginx
      dockerfile: Dockerfile
    container_name: orchestra-reverse-proxy-prod
    restart: always
    environment:
      ENVIRONMENT: "production"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount trusted Let's Encrypt or real-domain certificates (read-only)
      - ${ORCHESTRA_CERTS_DIR:-./nginx/certs/live}:/etc/nginx/certs/live:ro
      - certbot_webroot:/var/www/certbot
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - orchestra_edge

networks:
  orchestra_edge:
    driver: bridge
  orchestra_data:
    driver: bridge
    internal: true

volumes:
  orchestra_prod_pg_data:
  orchestra_prod_qdrant_data:
  orchestra_prod_storage_data:
  orchestra_prod_workspace_data:
  certbot_webroot:
